<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麦格拉编年史 - 历史名录</title>
    <style>
        :root {
            /* 废都物语重制版：暗金与石壁色调 */
            --ruina-dark-bg: rgba(20, 16, 13, 0.94); /* 深石褐 */
            --ruina-gold: #c3af8c;                    /* 古董金 */
            --ruina-gold-glow: #e0ca9d;               /* 亮金 */
            --ruina-text: #eaddc3;                    /* 象牙白 */
            --ruina-text-dim: rgba(234, 221, 195, 0.65); /* 提升非活跃文字可见度 */
            --ruina-crimson: #d34e4e;                 /* 鲜明的朱砂红 */
            --ruina-border-soft: rgba(195, 175, 140, 0.2); 
        }

        /* 全局自定义滚动条：接管所有容器，消灭白色滑轮 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0d0a08;
            border-left: 1px solid var(--ruina-border-soft);
        }
        ::-webkit-scrollbar-thumb {
            background: #2c2017;
            border: 1px solid var(--ruina-gold);
            border-radius: 2px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #423225;
            border-color: var(--ruina-gold-glow);
        }

        body {
            margin: 0; padding: 0;
            background-color: #0b0807;
            /* 背景图不透明度去除，恢复 100% 呈现，叠加密度恰当的暗色遮罩保障对比度 */
            background-image: 
                linear-gradient(rgba(11, 8, 7, 0.45), rgba(11, 8, 7, 0.65)),
                url('https://i.ibb.co/f6DhHhw/Ruina-Remake.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--ruina-text);
            font-family: "Source Han Serif SC", "Noto Serif SC", "SimSun", "NSimSun", "Georgia", serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        #game-screen {
            width: 95vw;
            max-width: 1450px;
            height: 92vh;
            display: flex;
            gap: 20px;
            z-index: 1;
        }

        /* === 经典JRPG双线金属边框面板 === */
        .ruina-panel {
            background: var(--ruina-dark-bg);
            border: 1px solid var(--ruina-gold);
            outline: 3px solid #14100d;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 10px 30px rgba(0,0,0,0.9);
            position: relative;
            backdrop-filter: blur(4px);
        }
        /* 四角古典金属包裹装饰 */
        .ruina-panel::before {
            content: ""; position: absolute; top: -3px; left: -3px; right: -3px; bottom: -3px;
            border: 1px solid var(--ruina-border-soft); pointer-events: none;
        }

        /* === 左侧：系统指令菜单 === */
        #sys-menu {
            flex: 0 0 290px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: 100%;
        }

        /* 标题窗 */
        .title-window {
            padding: 25px 20px;
            text-align: center;
            overflow: hidden;
        }

        /* 旋转的炼金法阵背景效果 */
        .astrolabe-bg {
            position: absolute; width: 220px; height: 220px;
            border: 1px double rgba(195, 175, 140, 0.08);
            border-radius: 50%;
            top: -50px; right: -50px;
            pointer-events: none;
            animation: spin 45s linear infinite;
        }
        .astrolabe-bg::after {
            content: ""; position: absolute; top: 15px; left: 15px; right: 15px; bottom: 15px;
            border: 1px dashed rgba(195, 175, 140, 0.05); border-radius: 50%;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .game-title h1 {
            font-size: 1.8em; margin: 0; color: #fff; letter-spacing: 5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            font-weight: normal;
        }
        .game-title span {
            font-size: 0.85em; color: var(--ruina-gold); letter-spacing: 3px;
            display: block; margin-top: 6px;
        }

        /* 指令菜单列表 */
        .command-window {
            flex: 1;
            padding: 25px;
            display: flex;
            flex-direction: column;
        }

        .command-list {
            display: flex; flex-direction: column; gap: 12px;
        }
        
        /* 按钮重构为完美的居中排版 */
        .按钮 {
            background: none; border: none; color: var(--ruina-text-dim);
            font-family: inherit; font-size: 1.1em; 
            font-weight: bold;
            padding: 8px 10px; cursor: pointer;
            position: relative; letter-spacing: 2px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.9);
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            transition: color 0.15s ease, text-shadow 0.15s ease;
        }

        /* 指令悬停双生符文动效 */
        .按钮::before, .按钮::after {
            content: "✦";
            color: var(--ruina-gold);
            font-size: 0.9em;
            opacity: 0;
            display: inline-block;
            margin: 0 8px;
            transition: opacity 0.15s ease, transform 0.15s ease;
        }
        /* 符文向中心聚拢的位移动效 */
        .按钮::before { transform: translateX(8px); }
        .按钮::after { transform: translateX(-8px); }

        .按钮:hover { 
            color: #fff; 
            text-shadow: 0 0 8px var(--ruina-gold-glow), 1px 1px 2px rgba(0, 0, 0, 0.9); 
        }
        .按钮:hover::before, .按钮:hover::after { 
            opacity: 1; 
            transform: translateX(0); 
        }

        .按钮-未保存 { 
            color: var(--ruina-crimson) !important; 
            text-shadow: 0 0 8px var(--ruina-crimson), 1px 1px 2px rgba(0, 0, 0, 0.9) !important;
        }
        .按钮-未保存::before, .按钮-未保存::after { color: var(--ruina-crimson); }

        .管理员组 { 
            display: none; flex-direction: column; gap: 12px;
            margin-top: 5px;
            border-top: 1px dashed var(--ruina-border-soft);
            padding-top: 15px;
        }
        body.编辑模式 .管理员组 { display: flex; }

        #status-bar-wrapper {
            margin-top: auto;
            border-top: 1px solid var(--ruina-border-soft);
            padding-top: 15px;
        }

        #状态栏 {
            font-size: 0.9em; color: var(--ruina-gold);
            line-height: 1.6;
            min-height: 50px;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.8);
        }

        /* === 右侧：手记卷宗 === */
        #book-content {
            flex: 1;
            height: 100%;
            overflow: hidden; /* 防止外层双重滚动 */
            display: flex;
            flex-direction: column;
        }

        .book-header {
            text-align: center; padding: 25px 0; 
            border-bottom: 1px solid var(--ruina-gold);
            font-size: 1.5em; font-weight: normal; letter-spacing: 8px;
            color: #fff;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
            background: rgba(0,0,0,0.2);
            position: relative;
        }
        .book-header::after {
            content: "✦"; position: absolute; bottom: -8px; left: 50%;
            transform: translateX(-50%); background: #14100d;
            padding: 0 10px; color: var(--ruina-gold); font-size: 0.8em;
        }

        .table-container {
            flex: 1;
            overflow-y: auto; /* 核心滚动区 */
        }

        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        
        thead th { 
            padding: 18px 20px; text-align: left; 
            border-bottom: 2px solid var(--ruina-gold); 
            font-weight: bold; font-size: 1.05em; letter-spacing: 2px;
            color: var(--ruina-gold);
            position: sticky; top: 0; background: #191411; z-index: 10;
        }
        
        td { 
            padding: 22px 20px; border-bottom: 1px solid var(--ruina-border-soft); 
            vertical-align: middle; font-size: 1em; line-height: 1.7;
            word-wrap: break-word; overflow-wrap: break-word;
        }

        tr:hover td { background-color: rgba(195, 175, 140, 0.03); }

        /* 高级卡槽头像框（无滤镜） */
        .立绘框 { 
            width: 75px; height: 95px; 
            border: 1px solid var(--ruina-gold); 
            outline: 1px solid rgba(0,0,0,0.8);
            padding: 2px; background: #000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: zoom-in; margin: 0 auto; 
            transition: transform 0.2s;
        }
        .立绘框:hover { transform: translateY(-2px); }
        .立绘框 img { 
            width: 100%; height: 100%; object-fit: cover; 
            filter: none !important; 
        }
        
        .姓名格 { font-weight: bold; color: #fff; font-size: 1.15em; text-shadow: 0 1px 2px #000; }
        
        /* 确保在编辑模式下，表格布局不破损 */
        body.编辑模式 td[contenteditable="true"] {
            border-bottom: 1px dashed var(--ruina-gold);
            cursor: text;
        }
        body.编辑模式 td[contenteditable="true"]:focus { 
            background: rgba(255, 255, 255, 0.08); outline: none;
            border-bottom: 1px solid var(--ruina-gold-glow);
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }

        .管理列 { display: none; }
        body.编辑模式 .管理列 { display: table-cell; }

        /* 调整管理框宽度与对齐，保证100px内不换行 */
        .管理格 { 
            display: flex; 
            gap: 4px; 
            justify-content: center; 
            align-items: center; 
            white-space: nowrap; 
        }
        .文字按钮 { 
            cursor: pointer; color: var(--ruina-gold); font-weight: normal; text-decoration: underline; font-size: 0.85em;
        }
        .文字按钮:hover { color: #fff; text-shadow: 0 0 5px var(--ruina-gold-glow); }

        /* === 对话框 === */
        .弹窗遮罩 {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center;
            backdrop-filter: blur(3px);
        }

        .对话框 {
            background: var(--ruina-dark-bg); border: 2px solid var(--ruina-gold);
            outline: 4px solid #14100d;
            padding: 30px; color: var(--ruina-text); border-radius: 2px;
            box-shadow: 0 20px 50px rgba(0,0,0,1);
            position: relative;
        }
        .对话框 h3 { 
            margin: 0 0 20px 0; font-size: 1.25em; letter-spacing: 3px;
            border-bottom: 1px solid var(--ruina-border-soft); padding-bottom: 12px; 
            color: #fff;
        }

        #名词输入区 {
            width: 100%; height: 380px;
            background: rgba(0,0,0,0.7); color: var(--ruina-text); 
            font-size: 15px; font-family: inherit; padding: 15px;
            border: 1px solid var(--ruina-gold);
            box-sizing: border-box; resize: none; line-height: 1.8; outline: none;
        }
        #名词输入区:focus { border-color: var(--ruina-gold-glow); }

        .网址输入 {
            width: 90%; padding: 10px; background: rgba(0,0,0,0.8); border: 1px solid var(--ruina-gold);
            color: #fff; margin-bottom: 15px; font-family: inherit;
        }

        #放大预览 img { 
            max-width: 80%; max-height: 80%; 
            border: 2px solid var(--ruina-gold); 
            outline: 6px solid #14100d;
            box-shadow: 0 20px 50px rgba(0,0,0,1);
            filter: none !important;
        }

        .弹窗按键区 { display: flex; gap: 15px; justify-content: flex-end; margin-top: 20px; }
        .弹窗按键区 .按钮 { padding: 4px 14px; font-size: 1em; }

    </style>
</head>
<body>

    <div id="game-screen">
        
        <!-- 左侧：系统指令菜单 -->
        <aside id="sys-menu">
            <div class="ruina-panel title-window">
                <div class="astrolabe-bg"></div>
                <div class="game-title">
                    <h1>废都物语</h1>
                    <span>✦ RUINA REMAKE ✦</span>
                </div>
            </div>

            <div class="ruina-panel command-window">
                <nav class="command-list">
                    <button class="按钮 按钮-模式" onclick="切换模式()" id="模式按钮">继续编撰</button>
                    <button class="按钮" onclick="加载数据()">云端同步</button>
                    <button class="按钮" onclick="导出备份()">导出记录</button>
                    
                    <div class="管理员组">
                        <button class="按钮" onclick="添加行()">记载新个体</button>
                        <button class="按钮" onclick="打开名词弹窗()">编纂名词录</button>
                        <button class="按钮" onclick="触发导入()">上传旧拓本</button>
                        <button class="按钮" id="保存按钮" onclick="保存到云端()" style="color:#7ee393;">编年史存储</button>
                    </div>
                </nav>

                <div id="status-bar-wrapper">
                    <div id="状态栏">
                        系统提示：<br>> 准备就绪，请选择你的指令。
                    </div>
                </div>
                <input type="file" id="导入框" style="display:none" accept=".json" onchange="导入备份(event)">
            </div>
        </aside>

        <!-- 右侧：手记卷宗 -->
        <main id="book-content" class="ruina-panel">
            <div class="book-header">
                ❖ 麦格拉编年史 ❖
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <!-- 压缩各列固有宽度，将表格最大化倾斜给“备注”列 -->
                            <th width="85" style="text-align:center;">立绘</th>
                            <th width="130">名称</th>
                            <th width="110">身份</th>
                            <th width="140">目的</th>
                            <th>备注</th>
                            <th width="100" class="管理列" style="text-align:center;"></th>
                        </tr>
                    </thead>
                    <tbody id="表格主体"></tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- 预览弹窗 -->
    <div id="放大预览" class="弹窗遮罩" onclick="this.style.display='none'">
        <img id="预览图" src="">
    </div>

    <!-- 名词录弹窗 -->
    <div id="名词弹窗" class="弹窗遮罩">
        <div class="对话框" style="width: 700px; max-width: 90%;">
            <h3>◆ 编纂名词录</h3>
            <textarea id="名词输入区" placeholder="在此处记录麦格拉的专有名词、失落的神之术式与野史传闻..."></textarea>
            <div class="弹窗按键区">
                <button class="按钮" onclick="确认保存名词()">[ 确定 ]</button>
                <button class="按钮" style="color:var(--ruina-text-dim);" onclick="关闭名词弹窗()">[ 取消 ]</button>
            </div>
        </div>
    </div>

    <!-- 换图弹窗 -->
    <div id="更图弹窗" class="弹窗遮罩">
        <div class="对话框" style="width: 440px;">
            <h3>◆ 替换幻影</h3>
            <p style="color:var(--ruina-text-dim); font-size:0.9em; margin-bottom: 20px;">使用法术直接粘贴剪贴板图片，或选择下方指令。</p>
            
            <button class="按钮" style="margin-bottom: 15px; color:#aaccff;" onclick="document.getElementById('隐藏上传').click()">[ 读取本地画片 ]</button>
            
            <input type="text" id="网址输入框" class="网址输入" placeholder="或者输入远端影像法阵链接...">
            
            <div class="弹窗按键区">
                <button class="按钮" onclick="确定网址()">[ 施法 ]</button>
                <button class="按钮" style="color:var(--ruina-text-dim);" onclick="关闭更图弹窗()">[ 取消 ]</button>
            </div>
        </div>
    </div>

    <input type="file" id="隐藏上传" style="display:none" accept="image/*">

    <script>
        const BIN_ID = '6a0575ad250b1311c34a91e5';
        const API_KEY = '$2a$10$y8zzhvJgc6dFJB7rYbhP1eSAH4yZyI6hjqJheCSwTXr/NvJbtVIsC';
        const IMG_BB_KEY = '192ec7a9ecdec9b51ffed683da3842dc';
        const 密码 = '781674';

        let 内存数据 = [];
        let 专有名词内容 = "";
        let 当前编辑索引 = -1;
        let 是否编辑模式 = false; 
        let 有未保存变更 = false;

        window.onload = function() { 
            加载数据(); 
            // 监听窗口关闭/刷新事件，若存在未保存变更则触发拦截提醒
            window.addEventListener('beforeunload', function (e) {
                if (navigator.userAgent.indexOf("Prerender") === -1 && 有未保存变更) {
                    e.preventDefault();
                    e.returnValue = '编年史存在尚未存储的草稿，确定要丢弃并离开吗？';
                    return '编年史存在尚未存储的草稿，确定要丢弃并离开吗？';
                }
            });
        };

        function 更新状态(text) {
            document.getElementById("状态栏").innerHTML = `系统提示：<br>> ${text}`;
        }

        function 切换模式() {
            if (!是否编辑模式) {
                const p = prompt("检测麦格拉之戒中....");
                if (p === 密码) {
                    是否编辑模式 = true;
                    document.body.classList.add('编辑模式');
                    document.getElementById('模式按钮').innerText = "结束编撰";
                    更新状态("权限确认。");
                    渲染表格();
                } else { alert("鉴定失败：麦格拉之戒未产生共鸣。"); }
            } else {
                if (有未保存变更 && !confirm("警告：尚有未存储的编年史，确定要丢弃并退出吗？")) return;
                是否编辑模式 = false;
                document.body.classList.remove('编辑模式');
                document.getElementById('模式按钮').innerText = "继续编撰";
                渲染表格();
            }
        }

        function 设置未保存状态(状态) {
            if ( 有未保存变更 !== 状态 ) {
                if (状态) {
                    // 若从已同步转为未同步，重置 beforeunload 的安全锁
                    有未保存变更 = true;
                } else {
                    onBeforeUnloadActive = false;
                    有未保存变更 = false;
                }
                const btn = document.getElementById('保存按钮');
                if (状态) {
                    btn.classList.add('按钮-未保存');
                    btn.innerText = "存档异变 (请保存)";
                    document.title = "* 未存档 - 麦格拉编年史";
                } else {
                    btn.classList.remove('按钮-未保存');
                    btn.innerText = "编年史存储";
                    btn.style.color = "#7ee393";
                    document.title = "麦格拉编年史 - 历史名录";
                }
            }
        }

        async function 加载数据() {
            更新状态("正在读取古代石碑...");
            try {
                // 使用指定的数据拉取获取接口 (GET)
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY, 'X-Bin-Meta': false }
                });
                const raw = await res.json();
                
                const data = raw.record || raw;
                if (data.npcs) {
                    内存数据 = data.npcs;
                    专有名词内容 = data.terms || "";
                } else {
                    内存数据 = Array.isArray(data) ? data : [];
                    专有名词内容 = "";
                }
                
                渲染表格();
                设置未保存状态(false);
                更新状态("石碑数据已成功同步。");
            } catch (e) { 更新状态("错误：无法连接至阿卡夏记录。"); }
        }

        function 渲染表格() {
            const tbody = document.getElementById("表格主体");
            tbody.innerHTML = '';
            const editableAttr = 是否编辑模式 ? 'contenteditable="true"' : '';

            内存数据.forEach((npc, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><div class="立绘框" onclick="预览图片('${npc.立绘}')"><img src="${npc.立绘}"></div></td>
                    <td ${editableAttr} onblur="同步内存(${index}, '姓名', this.innerText)" class="姓名格">${npc.姓名}</td>
                    <td ${editableAttr} onblur="同步内存(${index}, '职位', this.innerText)">${npc.职位}</td>
                    <td ${editableAttr} onblur="同步内存(${index}, '动机', this.innerText)">${npc.动机}</td>
                    <td ${editableAttr} onblur="同步内存(${index}, '备注', this.innerText)">${npc.备注}</td>
                    <td class="管理列">
                        <div class="管理格">
                            <span class="文字按钮" onclick="移动位次(${index}, -1)">[上]</span>
                            <span class="文字按钮" onclick="移动位次(${index}, 1)">[下]</span>
                            <span class="文字按钮" onclick="打开更图弹窗(${index})">[形]</span>
                            <span class="文字按钮" style="color:var(--ruina-crimson);" onclick="删除NPC(${index})">[删]</span>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function 同步内存(idx, key, val) {
            if (内存数据[idx][key] !== val.trim()) {
                内存数据[idx][key] = val.trim();
                设置未保存状态(true);
            }
        }

        function 添加行() {
            // 新增契约使用指定的默认占位图链接
            内存数据.push({ 立绘: 'https://via.placeholder.com/60', 姓名: '无名之辈', 职位: '异乡人', 动机: '被迷宫吸引', 备注: '尚无记载...' });
            渲染表格();
            设置未保存状态(true);
        }

        function 删除NPC(idx) {
            if (confirm("将其从存在中抹除？") && prompt("执行密令:") === 密码) {
                内存数据.splice(idx, 1);
                渲染表格();
                设置未保存状态(true);
            }
        }

        function 移动位次(index, step) {
            const newIndex = index + step;
            if (newIndex >= 0 && newIndex < 内存数据.length) {
                [内存数据[index], 内存数据[newIndex]] = [内存数据[newIndex], 内存数据[index]];
                渲染表格();
                设置未保存状态(true);
            }
        }

        // --- 名词录逻辑 ---
        function 打开名词弹窗() {
            document.getElementById('名词输入区').value = 专有名词内容;
            document.getElementById('名词弹窗').style.display = 'flex';
        }

        function 关闭名词弹窗() { document.getElementById('名词弹窗').style.display = 'none'; }

        function 确认保存名词() {
            const val = document.getElementById('名词输入区').value;
            if (专有名词内容 !== val) {
                专有名词内容 = val;
                设置未保存状态(true);
            }
            关闭名词弹窗();
        }

        async function 保存到云端() {
            if (prompt("阴谋论法师需要记号") !== 密码) return;
            更新状态("正在向世界树祈祷...");
            try {
                // 使用指定的数据同步保存接口 (PUT)
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                    body: JSON.stringify({ npcs: 内存数据, terms: 专有名词内容 })
                });
                设置未保存状态(false);
                更新状态("祈祷完成，你的事迹已化为传说。");
            } catch (e) { alert("存档破损，请重试！"); }
        }

        // --- 影像处理 ---
        function 打开更图弹窗(index) { 当前编辑索引 = index; document.getElementById('更图弹窗').style.display = 'flex'; }
        function 关闭更图弹窗() { document.getElementById('更图弹窗').style.display = 'none'; }
        
        function 确定网址() {
            const url = document.getElementById('网址输入框').value.trim();
            if (url) { 内存数据[当前编辑索引].立绘 = url; 渲染表格(); 设置未保存状态(true); 关闭更图弹窗(); }
        }

        async function 执行上传(file) {
            if (!file) return;
            关闭更图弹窗();
            更新状态("正在将画片转化为以太幻影...");
            try {
                const formData = new FormData();
                formData.append("image", file);
                // 使用指定的图片上传接口
                const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMG_BB_KEY}`, { method: "POST", body: formData });
                const result = await res.json();
                if (result.success) {
                    内存数据[当前编辑索引].立绘 = result.data.url;
                    渲染表格();
                    设置未保存状态(true);
                    更新状态("幻影具现化成功。");
                }
            } catch (err) { alert("具现化失败，请检查网络共鸣。"); }
        }

        document.getElementById('隐藏上传').onchange = (e) => 执行上传(e.target.files[0]);

        document.addEventListener('paste', (e) => {
            if (document.getElementById('停图弹窗')?.style.display === 'flex' || document.getElementById('更图弹窗').style.display === 'flex') {
                const items = (e.clipboardData || e.originalEvent.clipboardData).items;
                for (let item of items) { if (item.type.indexOf("image") !== -1) 执行上传(item.getAsFile()); }
            }
        });

        function 预览图片(s) { document.getElementById("预览图").src = s; document.getElementById("放大预览").style.display = 'flex'; }

        function 导出备份() {
            const blob = new Blob([JSON.stringify({ npcs: 内存数据, terms: 专有名词内容 }, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `手记断章_${new Date().toLocaleDateString()}.json`;
            a.click();
        }

        function 触发导入() { document.getElementById("导入框").click(); }
        function 导入备份(e) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const data = JSON.parse(ev.target.result);
                if (data.npcs) { 内存数据 = data.npcs; 专有名词内容 = data.terms; } else { 内存数据 = data; }
                渲染表格(); 设置未保存状态(true);
            };
            reader.readAsText(e.target.files[0]);
        }
    </script>
</body>
</html>
